<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- Header -->
        <header class="header">

            <p class="eyebrow">PERSONAL SPACE</p>

            <h1>To-Do List</h1>

            <p class="subtitle">
                Organize your tasks, one step at a time
            </p>

        </header>


        <!-- Add Task Section -->
        <section class="add-task-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Write your task..."
            >

            <button id="addTaskBtn">
                Add Task
            </button>

        </section>


        <!-- Task Heading -->
        <section class="task-header">

            <div>
                <p class="section-label">YOUR TASKS</p>
                <h2>Your To-Do List</h2>
            </div>

            <div class="task-count">
                <span id="taskCount">0</span>
                <span>TASKS</span>
            </div>

        </section>


        <!-- Tasks -->
        <section id="taskList" class="task-list">

            <div id="emptyMessage" class="empty-message">

                <div class="star">✦</div>

                <h3>No tasks yet</h3>

                <p>
                    Add something above and get started.
                </p>

            </div>

        </section>

    </div>


    <script src="todo.js"></script>

</body>

</html>
